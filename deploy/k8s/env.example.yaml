# Copy to env.yaml on the server and replace the host. The real file is NOT committed.
apiVersion: v1
kind: Secret
metadata:
  name: opengym-env
  namespace: opengym
type: Opaque
stringData:
  ORIGIN: https://gym.example.com
  RP_ID: gym.example.com
  RP_NAME: openGym
  TRUST_PROXY: "1"
  ALLOW_GUEST: "0"
  INVITE_ONLY: "0"
  FIRST_USER_ADMIN: "1"
  DEFAULT_LANG: es
  TZ: America/Tijuana
