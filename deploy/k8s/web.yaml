apiVersion: apps/v1
kind: Deployment
metadata:
  name: opengym-web
  namespace: opengym
  labels:
    app.kubernetes.io/name: opengym-web
    app.kubernetes.io/part-of: opengym
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opengym-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opengym-web
        app.kubernetes.io/part-of: opengym
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/duartesantos8/opengym-web:1.4.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NGINX_PORT
              value: "8080"
            - name: BACKEND
              value: api.opengym.svc.cluster.local
            - name: PORT
              value: "3000"
            - name: RESOLVER
              value: 10.43.0.10
            - name: BASE_PATH
              value: ""
            - name: MEDIA_UPLOAD_MAX
              value: 112m
            - name: CF_CONNECTING_IP
              value: ""
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: opengym
  labels:
    app.kubernetes.io/name: opengym-web
spec:
  selector:
    app.kubernetes.io/name: opengym-web
  ports:
    - name: http
      port: 8080
      targetPort: http
